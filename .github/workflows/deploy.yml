# Builds the app as static files and publishes it to GitHub Pages on every push to main
# (or by hand from the Actions tab). The site lives at https://<owner>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one, but a running deploy finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # github_pages preset adds .nojekyll (keeps the _nuxt folder) and a 404.html SPA fallback.
      # The base URL is the repo name, so links, the manifest and the service worker work under /<repo>/.
      - name: Build static site
        run: bunx nuxi generate
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
