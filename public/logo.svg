<!-- Full-bleed square: iOS/Android apply their own icon mask, and in-app <img> tags round it with CSS.
     Navy Vault mark: a simple wallet (easy to use) with a card tucked into its pocket and a keyhole on the clasp
     (private and safe), plus a cyan spark (innovation), the same 4-point spark as the coins.
     Centered and kept bold so it still reads at 32px; everything sits inside the maskable safe zone
     (circle of radius 205 around the center). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Same royal blue → deep navy as the .navy-card -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2448c4"/>
      <stop offset=".45" stop-color="#1b3592"/>
      <stop offset="1" stop-color="#111f57"/>
    </linearGradient>
    <radialGradient id="light" cx=".3" cy=".2" r=".75">
      <stop offset="0" stop-color="#6a89f5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6a89f5" stop-opacity="0"/>
    </radialGradient>
    <!-- Wallet: white front, pale blue back of the pocket -->
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e3ff"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4f0"/>
      <stop offset="1" stop-color="#7b93de"/>
    </linearGradient>
    <!-- Card in the spark's cyan → app blue, so it pops against the white wallet -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b6cf0"/>
    </linearGradient>
    <linearGradient id="clasp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2448c4"/>
      <stop offset="1" stop-color="#1b3592"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0a1238" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#light)"/>

  <!-- Back of the pocket, peeking above the front -->
  <rect x="112" y="178" width="288" height="210" rx="46" fill="url(#back)" filter="url(#shadow)"/>

  <!-- Card tucked into the pocket, tilted up on the left so the spark gets the top right -->
  <g transform="rotate(9 240 200)">
    <rect x="138" y="132" width="200" height="126" rx="20" fill="url(#card)"/>
    <rect x="160" y="156" width="40" height="30" rx="8" fill="#ffffff" opacity=".85"/>
    <rect x="160" y="204" width="110" height="10" rx="5" fill="#ffffff" opacity=".45"/>
  </g>

  <!-- Wallet front -->
  <rect x="112" y="234" width="288" height="176" rx="44" fill="url(#front)" filter="url(#shadow)"/>

  <!-- Navy clasp with a big keyhole, so the lock still shows at small sizes -->
  <path d="M400 278 h-78 a44 44 0 0 0 0 88 h78 z" fill="url(#clasp)"/>
  <circle cx="330" cy="312" r="15" fill="#ffffff"/>
  <path d="M323 318 h14 l4 28 a4 4 0 0 1 -4 4.5 h-14 a4 4 0 0 1 -4 -4.5 z" fill="#ffffff"/>

  <!-- Innovation spark with a soft glow, top right -->
  <path d="M368 84 Q372 124 412 128 Q372 132 368 172 Q364 132 324 128 Q364 124 368 84 Z" fill="#67e8f9" opacity=".55" filter="url(#glow)"/>
  <path d="M368 84 Q372 124 412 128 Q372 132 368 172 Q364 132 324 128 Q364 124 368 84 Z" fill="#a5f3fc"/>
</svg>
