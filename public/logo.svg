<!-- Full-bleed square: iOS/Android apply their own icon mask, and in-app <img> tags round it with CSS.
     Navy Vault mark: a simple wallet (easy to use) with a card tucked inside and a keyhole on the clasp
     (private and safe), plus a cyan spark (innovation).
     Everything sits inside the maskable safe zone (circle of radius 205 around the center). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Same royal blue → deep navy as the .navy-card -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2448c4"/>
      <stop offset=".45" stop-color="#1b3592"/>
      <stop offset="1" stop-color="#111f57"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r=".8">
      <stop offset="0" stop-color="#6a89f5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6a89f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7ff"/>
    </linearGradient>
    <!-- Steel-blue / silver metal, as .eth-coin -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3eaf8"/>
      <stop offset=".5" stop-color="#9fb3d9"/>
      <stop offset="1" stop-color="#5c77a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a1238" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#light)"/>

  <!-- Card tucked into the wallet -->
  <g transform="rotate(-8 240 200)">
    <rect x="150" y="150" width="200" height="120" rx="20" fill="url(#metal)"/>
    <rect x="172" y="174" width="40" height="28" rx="7" fill="#e3eaf8" opacity=".9"/>
  </g>

  <!-- Wallet front with a locked clasp -->
  <g filter="url(#shadow)">
    <rect x="108" y="222" width="296" height="176" rx="40" fill="url(#wallet)"/>
  </g>
  <path d="M404 270 h-84 a40 40 0 0 0 0 80 h84 z" fill="#c3d2ff"/>
  <circle cx="326" cy="302" r="13" fill="#1b3592"/>
  <rect x="320" y="306" width="12" height="28" rx="6" fill="#1b3592"/>

  <!-- Innovation spark -->
  <path d="M388 106 Q388 140 422 140 Q388 140 388 174 Q388 140 354 140 Q388 140 388 106 Z" fill="#67e8f9"/>
  <path d="M420 182 Q420 196 434 196 Q420 196 420 210 Q420 196 406 196 Q420 196 420 182 Z" fill="#67e8f9"/>
</svg>
