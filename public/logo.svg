<!-- Full-bleed square: iOS/Android apply their own icon mask, and in-app <img> tags round it with CSS -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#304acc"/>
      <stop offset="1" stop-color="#131b3c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>
  <!-- Scaled toward the center so the glyph stays inside the maskable-icon safe zone -->
  <g transform="translate(256 256) scale(0.84) translate(-256 -256)" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 176V136a24 24 0 0 0-24-24H144a40 40 0 0 0 0 80h240a24 24 0 0 1 24 24v56"/>
    <path d="M104 152v216a40 40 0 0 0 40 40h240a24 24 0 0 0 24-24v-56"/>
    <path d="M416 272v64h-64a32 32 0 0 1 0-64z" fill="#98b2fd" stroke="#98b2fd"/>
  </g>
</svg>
